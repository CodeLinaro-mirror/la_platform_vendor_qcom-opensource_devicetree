%YAML 1.0
---
$id: http://devicetree.org/schemas/bluetooth/btfm_slim.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Technologies, Inc. BTFM Slimbus Slave Driver

maintainers:
  - Rajith Cherian <rajicher@qti.qualcomm.com>

description: |
  BTFM Slimbus Slave driver configure and initialize slimbus slave device.
  Bluetooth A2DP, SCO and FM Audio data is transferred over slimbus interface.

  Required Node Structure: |
    BTFM Slimbus Slave Driver must be added as a subnode for Slim NGD Driver.

properties:
  compatible:
    enum:
      - slim217,221
  reg:
    maxItems: 1

additionalProperties: false

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    slimbus: btfmslim-driver {
		compatible = "slim217,221";
		reg = <1 0>;
		/* BT SLIM EP address*/
		qcom,btslim-address  = <0x0>;
		/* slimbus FM_Tx, SCO_Tx channels*/
		qcom,btslimtx-channels = <159 160>;
		/* slimbus SCO_A2DP_Rx A2DP_Rx */
		qcom,btslimrx-channels = <157 158>;
    };
