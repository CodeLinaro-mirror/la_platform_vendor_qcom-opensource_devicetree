%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/renesas,slg5b.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas SLG5B Low Power Regulator with I2C interface

maintainers:
  - Rajesh Bharathwaj <rabharat@qti.qualcomm.com>

properties:
  compatible:
    enum:
      - renesas,slg5b

  reg:
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      powerdriver@76 {
        compatible = "renesas,slg5b";
        reg = <0x76>;
      };
    };

...
