%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/qcom,fspapp-fscrypt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Fscrypt FSP Application Client

maintainers:
  - SasiKumar <sasikuma@oss.qualcomm.com>

description: |
  The Qualcomm Fscrypt FSP (Firmware Service Processor) Application Client
  provides an interface for communicating with the FSP firmware service.
  It is used by the Linux kernel to exchange messages and control data
  with firmware running on a dedicated subsystem.

properties:
  compatible:
    const: qcom,fspapp-fscrypt

required:
  - compatible

additionalProperties: false

examples:
  - |
    fspapp_fscrypt {
        compatible = "qcom,fspapp-fscrypt";
    };

